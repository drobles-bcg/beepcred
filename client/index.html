<!doctype html>
<html class="h-full" lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/media/beepcred/favicon.png" type="image/png" sizes="196x188" />
    <link rel="apple-touch-icon" href="/media/beepcred/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <meta
      name="description"
      content="BeepCred: community cred for drivers on the road. Vote on license plates, share photos, and browse the feed. Create an account to post and join the conversation."
    />
    <meta name="keywords" content="BeepCred,license plates,community,driving,cars" />
    <meta name="author" content="BeepCred" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700"
    />
    <style>
      .dark body {
        background-color: hsl(240 10% 4%);
      }
    </style>
    <script>
      (function () {
        try {
          const theme = localStorage.getItem('theme') || 'system';
          const prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches;
          const isDarkMode =
            theme === 'dark' || (theme === 'system' && prefersDark);
          if (isDarkMode) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="text-foreground bg-background flex h-full min-h-dvh flex-col text-base antialiased">
    <div class="flex min-h-dvh w-full grow flex-col" id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
